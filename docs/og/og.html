<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #fafaf9; color: #1c1917; font-family: Inter, "Segoe UI", Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
    background-image: radial-gradient(circle at 88% 18%, rgba(37,99,235,.10), transparent 40%),
                      radial-gradient(circle at 78% 92%, rgba(124,58,237,.08), transparent 40%);
  }
  .id { display: flex; align-items: center; gap: 22px; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; background: #1c1917; color: #fafaf9; display: grid; place-items: center; font-weight: 700; font-size: 32px; }
  .name { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .role { font-size: 26px; color: #2563eb; font-weight: 600; margin-top: 2px; }
  h1 { font-size: 76px; line-height: 1.04; letter-spacing: -.035em; margin: 44px 0 0; max-width: 900px; }
  .hl { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .foot { margin-top: 40px; font-size: 24px; color: #78716c; }
</style>
</head>
<body>
  <div class="id">
    <div class="avatar">GS</div>
    <div><div class="name">Gabriel Sosa</div><div class="role">Desarrollador Full-Stack</div></div>
  </div>
  <h1>Armo productos completos, de la <span class="hl">idea a producción.</span></h1>
  <div class="foot">Pagos · IA · QR · Firmware — gabrielsosa32.github.io/Portfolio</div>
</body>
</html>
